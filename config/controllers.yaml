controller:
  hero_chassis_controller:
    type: hero_chassis_controller/HeroChassisController

    subscriber_topic: /cmd_vel
    cmd_vel_timeout: 0.5

    # 摩擦前馈增益 (N·m·s/rad)，补偿车轮关节摩擦（模型 friction=0.05）
    feedforward_gain: 0.05

    # 速度指令坐标系模式: chassis(底盘坐标系) / world(全局坐标系)
    velocity_mode: chassis

    # 左前轮 PID
    pid_front_left:
      p: 1.0
      i: 0.5
      d: 0.0
      i_clamp: 2.0

    # 右前轮 PID
    pid_front_right:
      p: 1.0
      i: 0.5
      d: 0.0
      i_clamp: 2.0

    # 左后轮 PID
    pid_back_left:
      p: 1.0
      i: 0.5
      d: 0.0
      i_clamp: 2.0

    # 右后轮 PID
    pid_back_right:
      p: 1.0
      i: 0.5
      d: 0.0
      i_clamp: 2.0

  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50
